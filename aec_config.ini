# Acoustic Echo Cancellation (AEC) Component Configuration
# 
# This configuration file sets up the AEC component to process audio
# from a reference speaker output and a microphone input.

# AEC Component Configuration
[AEC_COMPONENT]

# Reference audio input port (speaker output - what is being played)
# This is the reference signal used for echo cancellation
referenceInputPort /aecComponent/reference:i

# Microphone audio input port (what the microphone records)
# This contains both the desired signal and the speaker echo
microphoneInputPort /aecComponent/microphone:i

# Audio output port (echo-canceled microphone signal)
audioOutputPort /aecComponent/audio:o

# Audio parameters
sample_rate 16000          # Sample rate in Hz
num_channels 1             # Number of channels (1=mono, 2=stereo)
block_ms 10                # Processing block size in milliseconds

# Optional disk recording
# When enabled, each emitted output block is saved as a separate WAV file.
saveIterativeAudioToDisk false
audioSaveMaxSeconds 60
audioSaveDirectory ./aec-recordings
audioSavePrefix aec_output

# AEC tuning
# Increase aec_stream_delay_ms if speaker voice leaks into output.
aec_mobile_mode false
aec_stream_delay_ms 120     
logAecStats true

# Connection Example (using yarp):
#
# 1. Connect your robot's speaker output to the reference port:
#    yarp connect /robot/audio_player /aecComponent/reference:i
#
# 2. Connect your microphone to the microphone port:
#    yarp connect /microphone/audio /aecComponent/microphone:i
#
# 3. Connect the output to your audio processing pipeline:
#    yarp connect /aecComponent/audio:o /your_speech_processor/audio:i
#
# The component will continuously:
# - Receive the reference signal (speaker output)
# - Receive the microphone signal (with echo)
# - Apply echo cancellation using WebRTC's AEC module
# - Output the processed audio (echo-canceled microphone signal)
